<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamWheel 拼图画布</title>
    <link rel="stylesheet" href="canvas_tool.css">
  </head>
  <body data-mode="embedded">
    <div class="canvas-app">
      <header class="toolbar" data-role="toolbar">
        <div class="toolbar-group">
          <button type="button" data-action="pick-images">上传图片</button>
          <button type="button" data-action="reset-view">重置视图</button>
          <button type="button" data-action="open-line-cut-mode">直线切割</button>
        </div>
        <div class="toolbar-group" data-role="export-controls">
          <span data-role="zoom-label">缩放 100%</span>
          <select data-field="export-format">
            <option value="jpg">JPG</option>
            <option value="png">PNG</option>
          </select>
          <button type="button" data-action="export-merged">合并导出</button>
          <button type="button" data-action="export-individual">逐张导出</button>
        </div>
      </header>

      <aside class="panel asset-panel" data-role="asset-panel">
        <h2>素材</h2>
        <div class="panel-body">
          <p>上传后会在这里显示缩略图。</p>
          <div class="asset-list" data-role="asset-list"></div>
        </div>
      </aside>

      <main class="canvas-stage" data-role="canvas-viewport">
        <div class="canvas-surface" data-role="canvas-surface">
          <div class="canvas-empty" data-role="canvas-empty">上传图片后开始拼图</div>
          <div class="canvas-items" data-role="canvas-items"></div>
          <div class="selection-overlay" data-role="selection-overlay"></div>
        </div>
      </main>

      <aside class="panel properties-panel" data-role="properties-panel">
        <h2>属性</h2>
        <div class="panel-body">
          <div data-role="normal-inspector">
            <div class="field-grid">
              <label>位置 X<input type="number" step="1" data-field="pos-x"></label>
              <label>位置 Y<input type="number" step="1" data-field="pos-y"></label>
              <label>宽度<input type="number" step="1" min="1" data-field="width"></label>
              <label>高度<input type="number" step="1" min="1" data-field="height"></label>
              <label>旋转<input type="number" step="1" data-field="rotation"></label>
              <label>裁剪 X<input type="number" step="1" min="0" data-field="crop-x"></label>
              <label>裁剪 Y<input type="number" step="1" min="0" data-field="crop-y"></label>
              <label>裁剪宽<input type="number" step="1" min="1" data-field="crop-width"></label>
              <label>裁剪高<input type="number" step="1" min="1" data-field="crop-height"></label>
            </div>
            <div class="action-row">
              <button type="button" data-action="bring-forward">置顶一层</button>
              <button type="button" data-action="send-backward">置底一层</button>
            </div>
            <div class="action-row">
              <button type="button" data-action="toggle-crop-mode">拖框裁剪</button>
              <button type="button" data-action="open-slice-mode">图片切片</button>
              <button type="button" data-action="reset-crop">重置裁剪</button>
              <button type="button" data-action="delete-item">删除图片</button>
            </div>
            <p class="hint" data-role="crop-mode-hint">开启拖框裁剪后，在画布里的图片上拖出裁剪框。</p>
          </div>
          <section hidden data-role="line-cut-panel" class="slice-panel">
            <div class="action-row slice-actions">
              <button type="button" data-action="confirm-line-cut">确认切割</button>
              <button type="button" data-action="cancel-line-cut">取消</button>
            </div>
            <p class="hint" data-role="line-cut-hint">选择单张未旋转图片后，可进入直线切割。</p>
          </section>
          <section hidden data-role="slice-panel" class="slice-panel">
            <div class="action-row panel-section">
              <label>切片模式
                <select data-field="slice-mode">
                  <option value="grid">网格切片</option>
                  <option value="guides">参考线切片</option>
                </select>
              </label>
            </div>
            <div class="panel-section" data-role="slice-grid-fields">
              <div class="field-grid">
                <label>行<input type="number" step="1" min="1" data-field="slice-rows"></label>
                <label>列<input type="number" step="1" min="1" data-field="slice-cols"></label>
              </div>
            </div>
            <div class="panel-section" data-role="slice-guide-fields">
              <div class="field-grid">
                <label>竖线位置<input type="text" data-field="slice-vertical-guides"></label>
                <label>横线位置<input type="text" data-field="slice-horizontal-guides"></label>
              </div>
              <div class="action-row">
                <button type="button" data-action="add-slice-vertical-guide">添加竖线</button>
                <button type="button" data-action="add-slice-horizontal-guide">添加横线</button>
              </div>
              <div class="action-row">
                <button type="button" data-action="clear-slice-vertical-guides">清空竖线</button>
                <button type="button" data-action="clear-slice-horizontal-guides">清空横线</button>
              </div>
            </div>
            <div class="action-row slice-actions">
              <button type="button" data-action="confirm-slice">确认生成切片</button>
              <button type="button" data-action="cancel-slice">取消</button>
            </div>
            <p class="hint" data-role="slice-hint">切片后会在原位置生成多个独立图片块。</p>
          </section>
          <p class="hint" data-role="selection-hint">先选择一张图片再编辑属性。</p>
        </div>
      </aside>
    </div>

    <div data-role="notice-region" class="notice-region" aria-live="polite"></div>
    <input type="file" accept="image/*" multiple hidden data-role="file-input">
    <div hidden data-role="canvas-context-menu" class="canvas-context-menu">
      <button type="button" data-action="context-open-line-cut">直线切割</button>
      <button type="button" data-action="context-open-slice">图片切片</button>
      <button type="button" data-action="context-toggle-crop">拖框裁剪</button>
      <button type="button" data-action="context-bring-forward">置顶一层</button>
      <button type="button" data-action="context-send-backward">置底一层</button>
      <button type="button" data-action="context-export-selection">导出选中</button>
      <button type="button" data-action="context-delete-item">删除图片</button>
    </div>
    <script src="canvas_tool.js"></script>
  </body>
</html>
